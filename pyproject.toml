[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scatterview"
version = "2.1.0"
description = "N-body simulation visualization tool with cubic spline interpolation, variable framerate, and automated camera control"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dany Atallah", email = "danyatallah@u.northwestern.edu" },
]
keywords = [
    "n-body",
    "simulation",
    "visualization",
    "vispy",
    "astrophysics",
    "scientific-visualization",
    "opengl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.12",
    "pandas>=1.3",
    "h5py",
    "vispy>=0.14",
    "PyQt6",
    "numba",
    "av",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ynad93/ScatterView.py"
Source = "https://github.com/ynad93/ScatterView.py"
Issues = "https://github.com/ynad93/ScatterView.py/issues"

[project.scripts]
scatterview = "scatterview.cli:main"

[tool.setuptools.packages.find]
include = ["scatterview*"]
exclude = ["scatterview.tests*"]
